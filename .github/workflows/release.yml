name: Release

on:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build x86_64 binary
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build MSI
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          wix build installer/windows/CodexSwitcher.wxs `
            -arch x64 `
            -d BinaryPath='${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\codex-switcher.exe' `
            -d ProductVersion=$version `
            -o target\CodexSwitcher-x86_64.msi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/x86_64-pc-windows-msvc/release/codex-switcher.exe
            target/CodexSwitcher-x86_64.msi
