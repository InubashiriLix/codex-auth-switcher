[package]
name = "codex-switcher"
version = "0.1.0"
edition = "2024"
description = "A local, terminal-native Codex authentication snapshot manager"
license = "MIT"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

