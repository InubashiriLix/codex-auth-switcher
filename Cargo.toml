[package]
name = "codex-switcher"
version = "0.2.1"
edition = "2024"
description = "A local, terminal-native Codex authentication snapshot manager"
license = "MIT"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
unicode-width = "0.2"
futures-util = "0.3"
rand = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
toml_edit = "0.22"
netstat2 = "0.11"
sysinfo = "0.37"
fluent-bundle = "0.16"
unic-langid = "0.9"

# 新增依赖
clap = { version = "4", features = ["derive"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = "0.6"
http-body-util = "0.1"
notify = "6"
notify-rust = "4"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
zstd = "0.13"
flate2 = "1"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
sd-notify = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
windows-service = "0.8"
